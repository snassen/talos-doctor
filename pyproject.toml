[project]
name = "talos-doctor"
version = "0.2.0"
description = "Checks that a Mac is ready for Talos, and screens pull requests for prompt injection before an agent reads them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Talos contributors" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
talos-doctor = "talos_doctor.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talos_doctor"]

[dependency-groups]
dev = ["pytest>=8"]
